<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked by the Guard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "IBM Plex Sans", -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #2a0e0e, #0b0d10 60%);
    color: #f4f4f5;
  }
  .card {
    width: min(720px, 92vw); text-align: center; padding: 48px 40px;
    border: 1px solid #3a1414; border-radius: 20px; background: #14171b;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .shield { font-size: 84px; line-height: 1; }
  h1 {
    margin: 14px 0 6px; font-size: 46px; letter-spacing: .04em; color: #ff4d4f;
    font-weight: 800;
  }
  .sub { color: #9aa3ab; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 28px; }
  .row { text-align: left; margin: 14px auto 0; max-width: 560px; }
  .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #727c84; margin-bottom: 4px; }
  .val {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 16px;
    background: #0d1013; border: 1px solid #26303a; border-radius: 10px;
    padding: 12px 14px; word-break: break-all; color: #ffd7d7;
  }
  .reason .val { color: #ffe7b3; border-color: #3a2f14; }
  .foot {
    margin-top: 30px; padding-top: 18px; border-top: 1px solid #222831;
    color: #7b848c; font-size: 13.5px;
  }
  .pill {
    display: inline-block; margin-top: 10px; font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: #ff8f8f; background: #2a1414; border: 1px solid #4a1e1e;
    padding: 6px 12px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️🚫</div>
    <h1>BLOCKED</h1>
    <div class="sub">Request denied by the Guard</div>

    <div class="row">
      <div class="label">The agent tried to open</div>
      <div class="val" id="url">—</div>
    </div>
    <div class="row reason">
      <div class="label">Reason</div>
      <div class="val" id="reason">—</div>
    </div>

    <div class="foot">
      The guarded agent is only allowed on <b id="allowed">the approved site</b>.
      This destination is off-list, so the navigation was never performed — the
      agent stays put and cannot leave to post, fetch code, or leak data.
      <div class="pill" id="ts">logged • guard</div>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const dec = s => { try { return decodeURIComponent(s); } catch { return s; } };
  document.getElementById('url').textContent =
    dec(q.get('url') || 'https://twitter.com/intent/tweet?text=verify+me');
  document.getElementById('reason').textContent =
    dec(q.get('reason') || 'off moltbook — the agent cannot leave to post, fetch code, or leak data');
  document.getElementById('allowed').textContent = dec(q.get('allowed') || 'moltbook.com');
  document.getElementById('ts').textContent =
    'logged ' + new Date().toLocaleTimeString() + ' • guard';
</script>
</body>
</html>
